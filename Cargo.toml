[package]
name = "perp_guard"
version = "0.1.0"
edition = "2021"

[features]
no-entrypoint = []

[dependencies]
solana-program = "3.0"
borsh = "1.5"
borsh-derive = "1.5"

[dev-dependencies]
solana-program-test = "3.0"
solana-sdk = "3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
crate-type = ["cdylib", "lib"]
