version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # No need to expose the DB port to the host

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py makemigrations core &&
             python manage.py migrate &&
             python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin')\" &&
             python seed_megacorp.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/:/usr/src/app/
    # The port is no longer published to the host machine
    depends_on:
      - db
    environment:
      - FLAG_FORMAT=H7Tex{%s}
    restart: unless-stopped

  frontend:
    build: ./frontend
    command: npm start
    volumes:
      - ./frontend/:/app
      - /app/node_modules
    # The port is no longer published to the host machine
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # This is the main port for the whole application
      - "80:80"
      - "3000:3000" # Keep this for local dev with Windows host if needed
      - "8000:8000" # Keep this for local dev with Windows host if needed
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
