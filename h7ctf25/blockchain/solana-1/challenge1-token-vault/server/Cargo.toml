[package]
name = "token-vault-server"
version = "0.1.0"
edition = "2021"

[dependencies]
sol-ctf-framework = { git = "https://github.com/otter-sec/sol-ctf-framework" }
token-vault = { path = "../program" }
solana-sdk = "2.2"
solana-program = "2.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[[bin]]
name = "token-vault-server"
path = "src/main.rs"

