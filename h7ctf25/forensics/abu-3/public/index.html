<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGF 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>KGF 2.0</h1>
            <p class="subtitle">Hard-Tier Forensics Challenge</p>
        </header>

        <div class="instructions">
            <h3>INSTRUCTIONS</h3>
            <ul>
                <li>This is the advanced continuation of KGF 1.0</li>
                <li>Use the same <code>compromised.tar</code> container snapshot</li>
                <li>These challenges require deeper binary analysis and unpacking</li>
                <li>Submit all answers to receive the flag</li>
            </ul>
        </div>

        <form id="challengeForm">
            <!-- Question 9 -->
            <div class="question">
                <label for="q9">
                    <span class="qnum">Question 9:</span>
                    What MD5 hash does the malware use to verify the downloaded scanner's integrity?
                </label>
                <input type="text" id="q9" name="q9" placeholder="Enter MD5 hash (lowercase)" data-length="32" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 10 -->
            <div class="question">
                <label for="q10">
                    <span class="qnum">Question 10:</span>
                    How many letters are in the Linux distribution name that the scanner script checks for?
                </label>
                <input type="text" id="q10" name="q10" placeholder="Enter number" data-length="1" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 11 -->
            <div class="question">
                <label for="q11">
                    <span class="qnum">Question 11:</span>
                    Extract the primary mining pool's FQDN from the unpacked miner binary. Do not include protocol or port.
                </label>
                <input type="text" id="q11" name="q11" placeholder="Enter FQDN only" data-length="21" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 12 -->
            <div class="question">
                <label for="q12">
                    <span class="qnum">Question 12:</span>
                    Extract the primary Monero wallet address from the unpacked miner.
                </label>
                <input type="text" id="q12" name="q12" placeholder="Enter full wallet address" data-length="95" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 13 -->
            <div class="question">
                <label for="q13">
                    <span class="qnum">Question 13:</span>
                    How many domain-based backup mining pools are configured (exclude IP-based pools)?
                </label>
                <input type="text" id="q13" name="q13" placeholder="Enter count" data-length="1" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 14 -->
            <div class="question">
                <label for="q14">
                    <span class="qnum">Question 14:</span>
                    What application-layer protocol does the miner use for pool communication?
                </label>
                <input type="text" id="q14" name="q14" placeholder="Enter protocol name (lowercase)" data-length="7" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 15 -->
            <div class="question">
                <label for="q15">
                    <span class="qnum">Question 15:</span>
                    Decode the base64-encoded alternative Monero wallet address from the miner.
                </label>
                <input type="text" id="q15" name="q15" placeholder="Enter full wallet address" data-length="95" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 16 -->
            <div class="question">
                <label for="q16">
                    <span class="qnum">Question 16:</span>
                    Extract the compilation date from the golang.org/x/sys module version. Format: YYYY-MM-DD
                </label>
                <input type="text" id="q16" name="q16" placeholder="YYYY-MM-DD" data-length="10" required>
                <span class="char-hint"></span>
            </div>

            <button type="submit" id="submitBtn">Submit All Answers</button>
        </form>

        <div id="result" class="result hidden"></div>
        <div id="flag" class="flag hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
